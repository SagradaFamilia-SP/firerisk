[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ignis-backend"
version = "0.1.0"
description = "PYROS wildfire intelligence API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "opentok>=3.0",
  "pydantic-settings>=2,<3",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.9,<1",
  "rasterio>=1.3,<2",
  "scikit-image>=0.24,<1",
  "ultralytics>=8.3",
  "uvicorn[standard]>=0.27,<1",
  "vonage",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
