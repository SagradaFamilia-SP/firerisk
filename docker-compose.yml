services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      # YOLO weights — not baked into the image (backend/.env: YOLO_MODEL_PATH=./models/best.pt,
      # resolved relative to the container's /app WORKDIR). Kept at the repo
      # root, not inside backend/, so it's easy to swap without touching the
      # backend tree. See backend/README.md.
      - ./models:/app/models:ro
      # Vonage private key — backend/.env: VONAGE_PRIVATE_KEY_PATH=./private.key,
      # same /app-relative resolution. Also kept at the repo root.
      - ./private.key:/app/private.key:ro
    ports:
      - "8000:8000"
    # The LLM server (MODEL_BASE_URL) runs on the host, not in this compose
    # project — "localhost" inside the container means the container itself,
    # so backend/.env must point at host.docker.internal instead. This makes
    # that hostname resolve on Linux too (Docker Desktop already provides it
    # on macOS/Windows).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      - API_PROXY_PASS=http://backend:8000
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
