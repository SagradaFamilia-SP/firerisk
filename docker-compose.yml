services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      # YOLO weights (best.pt) — not baked into the image, see backend/README.md.
      - ./backend/model:/app/model:ro
    ports:
      - "8000:8000"
    # The LLM server (MODEL_BASE_URL) runs on the host, not in this compose
    # project — "localhost" inside the container means the container itself,
    # so backend/.env must point at host.docker.internal instead. This makes
    # that hostname resolve on Linux too (Docker Desktop already provides it
    # on macOS/Windows).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      - API_PROXY_PASS=http://backend:8000
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
