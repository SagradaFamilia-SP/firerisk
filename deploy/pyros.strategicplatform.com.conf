# Apache vhost for https://pyros.strategicplatform.com
# Requires: mod_ssl, mod_proxy, mod_proxy_http, mod_headers, mod_rewrite
#   a2enmod ssl proxy proxy_http headers rewrite

<VirtualHost *:80>
    ServerName pyros.strategicplatform.com
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName pyros.strategicplatform.com

    # Wildcard cert for *.strategicplatform.com — same paths for every subdomain vhost.
    # SSLCertificateChainFile is deprecated in Apache 2.4 and errors out
    # ("Failed to configure CA certificate chain") on some cert/CA file
    # combinations. The supported way is to concatenate leaf + CA into one
    # file and only set SSLCertificateFile — see backend/README.md or the
    # deploy notes for the `cat` command that builds this fullchain file.
    SSLEngine on
    SSLCertificateFile      /etc/ssl/certs/strategicplatform.com.fullchain.crt
    SSLCertificateKeyFile   /etc/ssl/private/strategicplatform.com.key

    DocumentRoot /home/ubuntu/firerisk/frontend/dist

    <Directory /home/ubuntu/firerisk/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # SPA fallback: unmatched routes serve index.html.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteRule ^ /index.html [L]
    </Directory>

    # Reverse proxy /api/* to the local uvicorn backend (127.0.0.1:8000).
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog  ${APACHE_LOG_DIR}/pyros-error.log
    CustomLog ${APACHE_LOG_DIR}/pyros-access.log combined
</VirtualHost>
